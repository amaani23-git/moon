version: '3.8'

services:
  web:
    build: .
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - db
  
  test:
    build: .
    command: pytest
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SECRET_KEY=test-key
      - DATABASE_URL=postgres://moon_user:moon_password@db:5432/moon_test_db
    depends_on:
      - db

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=moon_db
      - POSTGRES_USER=moon_user
      - POSTGRES_PASSWORD=moon_password

volumes:
  postgres_data: