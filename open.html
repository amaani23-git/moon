<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niique | Technologies Company Limited</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<style>
    :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #1e293b;
            --accent: #f59e0b;
            --light: #f8fafc;
            --dark: #0f172a;
            --gray: #64748b;
            --gray-light: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 8px;
            --transition: all 0.3s ease;
        }

        .dark-mode {
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --secondary: #e2e8f0;
            --light: #0f172a;
            --dark: #f1f5f9;
            --gray: #94a3b8;
            --gray-light: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }
    body {
        font-family: 'Poppins', sans-serif;
        line-height: 1.6;
        color: var(--dark);
        background-color: var(--light);
        transition: var(--transition);
        overflow-x: hidden;
    }
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }
    header {
        background-color: var(--light);
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 1000;
        transition: var(--transition);
    }
    .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 0;
    }
    .logo {
        font-size: 28px;
        font-weight: 700px;
        color: var(--secondary);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .logo span {
        color: var(--primary);
    }
    .nav-menu {
        display: flex;
        list-style: none;
        align-items: center;
        gap: 25px;
    }
    .nav-link {
        text-decoration: none;
        color: var(--secondary);
        font-weight: 500;
        transition: var(--transition);
        position: relative;
        padding: 5px 0;
    }
    .nav-link:hoover {
        color: var(--primary);
    }
    .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: 0;
        left: 0;
        background-color: var(--primary);
        transition: var(--transition);
    }
    .nav-link:hoover::after {
        width: 100%;
    }
    .nav-actions {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .search-container {
        position: relative;
    }
    .search-input {
            padding: 8px 15px;
            padding-right: 40px;
            border: 1px solid var(--gray-light);
            border-radius: 50px;
            background-color: var(--light);
            color: var(--dark);
            transition: var(--transition);
            width: 200px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            width: 250px;
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--secondary);
            cursor: pointer;
            font-size: 20px;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            color: var(--primary);
            transform: rotate(30deg);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background-color: var(--primary);
            color: white;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            width: 30px;
            height: 20px;
            position: relative;
        }

        .hamburger span {
            display: block;
            position: absolute;
            height: 3px;
            width: 100%;
            background: var(--secondary);
            border-radius: 3px;
            opacity: 1;
            left: 0;
            transform: rotate(0deg);
            transition: .25s ease-in-out;
        }

        .hamburger span:nth-child(1) {
            top: 0px;
        }

        .hamburger span:nth-child(2) {
            top: 8px;
        }

        .hamburger span:nth-child(3) {
            top: 16px;
        }

        .hamburger.active span:nth-child(1) {
            top: 8px;
            transform: rotate(135deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
            left: -60px;
        }

        .hamburger.active span:nth-child(3) {
            top: 8px;
            transform: rotate(-135deg);
        }
        
@keyframes mymove {
    from {background-color: red;}
    to {background-color: blue;}
}

</style>
<body>
    <header>
        <div class="container">
            <nav class="nav-container">
                <a href="" class="logo">
                    <i class="fas fa-cube"></i>
                    Niique <span>Tech</span>
                </a>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="#about" class="nav-link">About</a>
                    </li>
                    <li class="nav-item">
                        <a href="#feature" class="nav-link">Feature</a>
                    </li>
                    <li class="nav-item">
                        <a href="#service" class="nav-link">Services</a>
                    </li>
                    <li class="nav-item">
                        <a href="#contact" class="nav-link">Contact</a>
                    </li>
                    <li class="nav-item nav-actions">
                        <div class="search-container">
                            <input type="text" class="search-input" placeholder="search.....">
                            <button class="searc-btn"><i class="fas fa-search"></i></button>
                        </div>
                        <button class="theme-toggle" id="themeToggle">
                            <i class="fas fa-moon"></i>
                        </button>
                        <button class="btn btn-primary" id="loginBtn">
                            <i class="fas fa-sign-in-alt"></i>
                            Login
                        </button>
                    </li>
                </ul>
                <button class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </nav>
        </div>
    </header>
        <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content fade-in">
                <h1>Advanced Web Solutions for Modern Businesses</h1>
                <p>Transform your digital presence with our cutting-edge web development platform. Powerful, intuitive, and designed for growth.</p>
                <div class="hero-btns">
                    <a href="#features" class="btn btn-primary">
                        <i class="fas fa-rocket"></i>
                        Get Started
                    </a>
                    <a href="#dashboard" class="btn btn-outline" style="color: white; border-color: white;">
                        <i class="fas fa-play-circle"></i>
                        Watch Demo
                    </a>
                </div>
            </div>
        </div>
    </section>


<script>
        // Toggle Navigation
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.querySelector('.nav-menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Close mobile menu when clicking on a nav link
        document.querySelectorAll('.nav-link').forEach(n => n.addEventListener('click', () => {
            hamburger.classList.remove('active');
            navMenu.classList.remove('active');
        }));

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        });

        // Auth Modal Functionality
        const loginBtn = document.getElementById('loginBtn');
        const ctaSignup = document.getElementById('ctaSignup');
        const authModal = document.getElementById('authModal');
        const closeModal = document.getElementById('closeModal');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        const openAuthModal = (showRegisterForm = false) => {
            authModal.style.display = 'flex';
            setTimeout(() => {
                authModal.classList.add('active');
                if (showRegisterForm) {
                    showRegistrationForm();
                }
            }, 10);
        };

        const closeAuthModal = () => {
            authModal.classList.remove('active');
            setTimeout(() => {
                authModal.style.display = 'none';
            }, 300);
        };

        loginBtn.addEventListener('click', () => openAuthModal(false));
        ctaSignup.addEventListener('click', () => openAuthModal(true));

        closeModal.addEventListener('click', closeAuthModal);

        window.addEventListener('click', (e) => {
            if (e.target === authModal) {
                closeAuthModal();
            }
        });

        // Switch between login and registration forms
        showRegister.addEventListener('click', (e) => {
            e.preventDefault();
            showRegistrationForm();
        });

        showLogin.addEventListener('click', (e) => {
            e.preventDefault();
            showLoginForm();
        });

        function showRegistrationForm() {
            loginForm.classList.remove('active');
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            registerForm.classList.add('active');
        }

        function showLoginForm() {
            registerForm.classList.remove('active');
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            loginForm.classList.add('active');
        }

        // Login Form Submission
        const loginFormElement = document.getElementById('loginFormElement');
        loginFormElement.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            // In a real application, you would send this data to a server
            alert(`Login attempted with:\nEmail: ${email}\nPassword: ${password}`);
            
            // Reset form and close modal
            loginFormElement.reset();
            closeAuthModal();
        });

        // Registration Form Submission
        const registerFormElement = document.getElementById('registerFormElement');
        registerFormElement.addEventListener('submit', (e) => {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Simple validation
            if (password !== confirmPassword) {
                alert("Passwords don't match!");
                return;
            }
            
            // In a real application, you would send this data to a server
            alert(`Registration attempted with:\nName: ${firstName} ${lastName}\nEmail: ${email}\nPassword: ${password}`);
            
            // Reset form and close modal
            registerFormElement.reset();
            closeAuthModal();
        });

        // Animated Counter for Stats
        const counters = document.querySelectorAll('.stat-number');
        const speed = 200;

        const animateCounter = () => {
            counters.forEach(counter => {
                const target = +counter.getAttribute('data-target');
                const count = +counter.innerText;
                const increment = target / speed;

                if (count < target) {
                    counter.innerText = Math.ceil(count + increment);
                    setTimeout(animateCounter, 1);
                } else {
                    counter.innerText = target;
                }
            });
        };

        // Intersection Observer for animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    if (entry.target.classList.contains('stats-container')) {
                        animateCounter();
                    }
                    entry.target.classList.add('fade-in');
                }
            });
        }, observerOptions);

        // Observe elements for animation
        document.querySelectorAll('.fade-in').forEach(el => {
            observer.observe(el);
        });

        // Search functionality
        const searchInput = document.querySelector('.search-input');
        const searchBtn = document.querySelector('.search-btn');

        searchBtn.addEventListener('click', () => {
            if (searchInput.value.trim() !== '') {
                alert(`Searching for: ${searchInput.value}`);
                searchInput.value = '';
            }
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                alert(`Searching for: ${searchInput.value}`);
                searchInput.value = '';
            }
        });
    </script>
</body>

</html>
