{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Niique Investors - Building Community, Creating Opportunities">
    <meta name="theme-color" content="#61dafb">
    <title>{% block title %}Moon{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <link rel="stylesheet" href="{% static 'css/advanced.css' %}">
    {% block extra_css %}{% endblock extra_css %}
    <style>
        /* Additional global styles */
        body.using-keyboard *:focus {
            outline: 2px solid #61dafb;
            outline-offset: 2px;
        }
        
        .invalid {
            border-color: #ff4444 !important;
        }
        
        .invalid::after {
            content: 'Invalid';
            color: #ff4444;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    {% block content %}
    {% endblock content %}

    {% block extra_js %}{% endblock extra_js %}
    <script src="{% static 'js/index.js' %}"></script>
    <script src="{% static 'js/advanced.js' %}"></script>
</body>
</html>
