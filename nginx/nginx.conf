upstream moon {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://moon;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/backend/staticfiles/;
    }

    location /media/ {
        alias /app/backend/mediafiles/;
    }
}